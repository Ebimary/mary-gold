[build]
  publish = "dist"
  command = "bash scripts/build.sh"

# Pretty URLs would rewrite links to trailing-slash form and fight with the
# explicit clean-URL rules below. We manage clean URLs ourselves.
[build.processing.html]
  pretty_urls = false

# ---------------------------------------------------------------- CLEAN URLS
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/programs"
  to = "/programs.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# ------------------------------------------------------------------- HEADERS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"

# Content files are edited through the CMS and change on every publish, so
# they must never be served from a stale CDN cache.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Photos are replaced in place, under the same file name, so a cached copy
# can be the previous photo. The build gives every image URL a content
# version token (/images/x.jpg?v=...), which makes a replaced photo a new
# URL, and revalidation makes sure nothing stale is ever handed out.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
